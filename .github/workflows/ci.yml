name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: moon version --all

      - name: Fetch dependency index
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Test on native
        run: |
          moon test --deny-warn 2>&1 | tee native-test.log
          # a run that discovers zero tests also exits 0, so assert on the summary
          grep -q "failed: 0" native-test.log
          grep -q "Total tests: " native-test.log
          ! grep -q "Total tests: 0," native-test.log

      - name: Test on js
        run: moon test --target js --deny-warn

      - name: Test on wasm-gc
        run: moon test --target wasm-gc --deny-warn

      - name: Formatting
        run: moon fmt --check

      - name: CLI smoke test
        run: moon run cmd/main --target wasm-gc -- info testdata/mbr-ntfs.img

      - name: End-to-end on the generated NTFS image
        run: |
          set -euo pipefail
          # 每一步都套 timeout：万一某条命令挂住，让它在两分钟内失败并打印
          # 是哪一条，而不是把 job 卡到 GitHub 的默认上限。
          run_cli() {
            # 分隔线走 stderr：stdout 要留给命令本身的输出，否则和 js 的
            # 输出 diff 时会多出这一行
            echo "--- moonfs $* ---" >&2
            timeout --signal=KILL 120 moon run cmd/main --target wasm-gc -- "$@"
          }
          run_cli ls testdata/synth-ntfs.img / | tee ls.txt
          # 换后端后输出必须逐字节一致。js 的 argv 带着脚本路径，这条曾经
          # 在 js 上直接报 unknown command，而 wasm-gc 正常——不 diff 看不出来。
          moon run cmd/main --target js -- ls testdata/synth-ntfs.img / > ls-js.txt
          diff ls.txt ls-js.txt
          run_cli info testdata/win-ntfs.img > info-gc.txt
          moon run cmd/main --target js -- info testdata/win-ntfs.img > info-js.txt
          diff info-gc.txt info-js.txt
          grep -q "hello.txt" ls.txt
          grep -q "compressed.txt" ls.txt
          grep -q "compressed" ls.txt
          grep -q "sparse" ls.txt
          grep -q "deep.bin" ls.txt
          run_cli export testdata/synth-ntfs.img /compressed.txt out-comp.bin
          run_cli export testdata/synth-ntfs.img /big.bin out-big.bin
          run_cli export testdata/synth-ntfs.img /sparse.bin out-sparse.bin
          run_cli export testdata/synth-ntfs.img /split.bin out-split.bin
          run_cli export testdata/synth-ntfs.img /deep.bin out-deep.bin
          # $MFT 自己拆成两段、列表也非常驻的卷：根目录在第二段里
          run_cli ls testdata/synth-mft-split.img / | tee ls-split.txt
          grep -q "after.bin" ls-split.txt
          run_cli export testdata/synth-mft-split.img /after.bin out-after.bin
          # 命名数据流：默认流之外的字节必须能单独列、单独读
          run_cli streams testdata/synth-ntfs.img /hello.txt | tee streams.txt
          grep -q "meta" streams.txt
          run_cli cat testdata/synth-ntfs.img /hello.txt:meta > ads.txt
          grep -q "ads:meta" ads.txt
          # 重解析点：读链接本身要报错并给出目标，不能当作空文件返回
          grep -q "reparse:symlink" ls-split.txt
          if run_cli cat testdata/synth-mft-split.img /link.txt > link.txt 2>&1; then
            echo "reading a reparse point must fail" >&2
            exit 1
          fi
          grep -q "reparse point" link.txt
          grep -q "notepad.exe" link.txt
          # EFS 文件：必须是明确的错误 + 非零退出码，不能把密文当内容吐出来
          if run_cli cat testdata/synth-mft-split.img /secret.bin > secret.txt 2>&1; then
            echo "reading an EFS file must fail" >&2
            exit 1
          fi
          grep -q "encrypted" secret.txt
          if grep -q "EFS ciphertext" secret.txt; then
            echo "ciphertext leaked into the output" >&2
            exit 1
          fi
          python3 - <<'PY'
          comp = open("out-comp.bin", "rb").read()
          assert len(comp) == 1024, f"compressed length {len(comp)}"
          assert comp == b"A" * 1024, "decompressed payload differs from the original"
          big = open("out-big.bin", "rb").read()
          assert len(big) == 1000, f"big.bin length {len(big)}"
          assert big == bytes((i * 37 + 11) & 0xFF for i in range(1000)), "big.bin differs"
          sparse = open("out-sparse.bin", "rb").read()
          assert sparse == bytes(512), "sparse file did not read back as zeros"
          split = open("out-split.bin", "rb").read()
          assert len(split) == 2000, f"split.bin length {len(split)}"
          assert split == bytes((i * 7 + 3) & 0xFF for i in range(2000)), "split.bin differs: $ATTRIBUTE_LIST extents were not merged"
          deep = open("out-deep.bin", "rb").read()
          assert len(deep) == 2000, f"deep.bin length {len(deep)}"
          assert deep == bytes((i * 13 + 5) & 0xFF for i in range(2000)), "deep.bin differs: the non-resident $ATTRIBUTE_LIST was not followed"
          after = open("out-after.bin", "rb").read()
          assert after == b"read from the second MFT run\n", "the second $MFT run was not joined"
          print("compressed, non-resident, sparse and split-MFT payloads verified")
          PY
          # 可运行示例：验收要求里的"至少一个可运行示例"，必须真能跑。
          # 跑的是库 API（不经过 CLI 的路径解析），因此它同时验证了
          # list_directory / list_streams / reparse_of 的公开用法。
          timeout --signal=KILL 120 moon run examples/walk --target wasm-gc -- testdata/synth-ntfs.img | tee walk.txt
          grep -q "/hello.txt  14 B" walk.txt
          grep -q ":meta  9 B" walk.txt
          grep -q "/deep.bin  2000 B" walk.txt
          timeout --signal=KILL 120 moon run examples/walk --target js -- testdata/synth-ntfs.img > walk-js.txt
          diff walk.txt walk-js.txt
